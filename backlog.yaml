      framer-motion and lucide-react.
    commands:
      - "npx create-next-app@latest frontend --typescript --tailwind --app --no-src-dir --import-alias '@/*' --use-npm --eslint --no-turbopack"
      - "cd frontend && npx shadcn@latest init -d"
      - "cd frontend && npx shadcn@latest add button card progress radio-group select badge alert separator label"
      - "cd frontend && npm install framer-motion lucide-react"
    acceptance_criteria:
      - "frontend/package.json exists and includes next, react, framer-motion, lucide-react in dependencies"
      - "frontend/components/ui/button.tsx exists"
