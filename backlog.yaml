    rationale: "Gemma-4-specific feature; visually unique; differentiates the technical depth score."
    estimated_minutes: 120
    depends_on: ["D3-T04"]
    description: |
      Stream Gemma's reasoning chunks to the UI while the request is in flight,
      so the judge sees the model's chain-of-thought materialize on screen.
    status: pending

  - id: OPT-02
    title: "Native function calling — Gemma calls compute_hints() and lookup_icvd()"
    rationale: "Strong signal of Gemma 4 native-feature exploitation for the technical judge."
    estimated_minutes: 180
    depends_on: ["D2-T03"]
    description: |
      Refactor the LLM call to use ollama function-calling so Gemma 4 invokes
      backend tools rather than receiving everything inline. Tools:
        - compute_hints_score(responses)
        - lookup_icvd_criterion(diagnosis)
    status: pending

  - id: OPT-03
    title: "Mention multimodal audio input as future work in writeup"
    rationale: "Signals ambition without scope creep."
    estimated_minutes: 15
    depends_on: ["D4-T09"]
    description: |
      Add a short paragraph in section 6 (Limitations & Next Steps) noting
      Gemma 4 supports native audio and that voice-input dictation for the
      clinician is a planned post-hackathon experiment.
    status: pending

