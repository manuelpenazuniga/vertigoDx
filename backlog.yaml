# =============================================================================
# VertigoDx — Hackathon Execution Backlog
# =============================================================================
# Machine-readable task list for the 4-day Gemma 4 Good Hackathon sprint.
# Designed to be consumed by AI coding agents (Sonnet 4.6 and equivalents)
# that pick up the next `pending` task whose dependencies are `completed`.
#
# Conventions:
#   - Status lifecycle: pending -> in_progress -> completed (or blocked)
#   - Task IDs:         D{day}-T{nn}  (e.g. D1-T03)
#   - All commands are non-interactive unless explicitly noted
#   - Artifacts use repo-relative paths
#   - "must_match" assertions in acceptance criteria are regex/substring tests
#   - Agents MUST mark a task as completed only when EVERY acceptance criterion
#     passes; if blocked, set status: blocked and add a `blocker` field
# =============================================================================

project: vertigodx
version: 1.0
generated_at: 2026-05-15
deadline_utc: 2026-05-18T23:59:00Z
target_submit_utc: 2026-05-17T23:59:00Z   # 24h buffer before deadline
hackathon_url: https://www.kaggle.com/competitions/gemma-4-good-hackathon
target_tracks:
  - "Impact Track — Health & Sciences ($10K)"
  - "Special Tech Track — Ollama ($10K)"
  - "Main Track (stretch)"

# ---------------------------------------------------------------------------
# Global invariants — apply to EVERY task. An agent that violates these
# must revert its change and re-plan, not push forward.
# ---------------------------------------------------------------------------
global_invariants:
  - id: G1
    rule: "All clinical UX text is in Spanish (questions, reasoning, alerts, next steps, limitations)."
  - id: G2
    rule: "All code, comments, commit messages and public docs are in English."
  - id: G3
    rule: "100% local execution. No external API calls in the request path. Ollama at localhost:11434 is the only external process."
  - id: G4
    rule: "Three-layer architecture with graceful degradation: rules engine -> RAG -> Gemma. The LLM never invents diagnoses absent from rule output."
  - id: G5
    rule: "Pydantic schemas on every clinical I/O. No `dict[str, Any]` in route signatures."
  - id: G6
    rule: "Confidence values are exactly `alta` | `media` | `baja`. Never claim 'definitive diagnosis'."
  - id: G7
    rule: "Never commit anything under docs/ or resources/. They are gitignored on purpose."
  - id: G8
    rule: "Demo cases in data/demo_cases.json are ground truth. Never edit them to make a test pass."
  - id: G9
    rule: "Push directly to main with conventional commits. Speed > PRs during the hackathon only."

# ---------------------------------------------------------------------------
# Milestones — coarse-grained day-level outcomes
# ---------------------------------------------------------------------------
milestones:
  - id: M1
    day: 1
    name: "Backend foundations"
    outcome: "Ollama + models pulled, deterministic rule engine + triage + RAG + Gemma client all functional; FastAPI returns a clinically correct stroke result via curl."
  - id: M2
    day: 2
    name: "Clinical-grade prompts + frontend scaffold"
    outcome: "All 5 demo cases pass end-to-end with Spanish reasoning that cites ICVD criteria; Next.js 14 + shadcn scaffold renders the landing page."
  - id: M3
    day: 3
    name: "UI polish + deploy"
    outcome: "Questionnaire wizard + result panel finished; stroke alert visually dramatic; one-click demo cases page; deploy reachable from a public URL."
  - id: M4
    day: 4
    name: "Video + writeup + submit"
    outcome: "YouTube video <=3 min public; Kaggle writeup <=1500 words submitted in Impact Track Health & Sciences with cover image, repo link, and live demo link."

# ---------------------------------------------------------------------------
# Pathologies in MVP scope (do not expand without explicit instruction)
# ---------------------------------------------------------------------------
mvp_pathologies:
  - "BPPV (posterior canal)"
  - "Vestibular Migraine"
  - "Ménière's Disease"
  - "Central Vertigo (stroke)"

out_of_scope_pathologies:
  - "Vestibular neuritis"
  - "PPPD"
  - "Vestibular paroxysmia"
  - "Perilymphatic fistula"
  - "Superior canal dehiscence"
  - "Orthostatic dizziness"

# ===========================================================================
# DAY 1 — Backend foundations
# ===========================================================================
tasks:

  - id: D1-T01
    day: 1
    milestone: M1
    title: "Install Ollama and pull Gemma 4 + embeddings models"
    type: setup
    estimated_minutes: 45
    description: |
      Install Ollama as a brew service and pull the three models the MVP depends on:
      gemma4:26b-a4b-it-q4_K_M (primary clinical reasoner), gemma4:e4b (fallback for
      lower-memory hosts), and nomic-embed-text (RAG embeddings).
    commands:
      - "brew install ollama"
      - "brew services start ollama"
      - "ollama pull gemma4:26b-a4b-it-q4_K_M"
      - "ollama pull gemma4:e4b"
      - "ollama pull nomic-embed-text"
      - "ollama list"
    acceptance_criteria:
      - "`ollama list` output contains all three model names"
      - "`ollama run gemma4:26b-a4b-it-q4_K_M 'Hola, responde en español: ¿qué es BPPV?'` returns a Spanish response mentioning 'canal' or 'posicional' within 60 seconds"
    dependencies: []
    artifacts: []
    status: pending

  - id: D1-T02
    day: 1
    milestone: M1
    title: "Initialize repo structure (backend, frontend, data directories)"
    type: scaffold
    estimated_minutes: 15
    description: |
      Create the directory tree expected by every downstream task. Files are
      created empty here; their content is written by later tasks.
    commands:
      - "mkdir -p backend/app/data backend/tests backend/scripts data frontend"
      - "touch backend/app/__init__.py backend/app/main.py backend/app/rules.py backend/app/triage.py backend/app/rag.py backend/app/llm.py backend/app/prompts.py backend/app/schemas.py"
      - "touch backend/tests/__init__.py backend/tests/test_rules.py backend/tests/test_triage.py backend/tests/test_demo_cases.py"
      - "touch backend/app/data/icvd_corpus.md"
      - "touch data/demo_cases.json"
    acceptance_criteria:
      - "`find backend -type f -name '*.py' | wc -l` returns >= 9"
      - "`ls data/demo_cases.json backend/app/data/icvd_corpus.md` succeeds"
    dependencies: []
    artifacts:
      - "backend/app/"
      - "backend/tests/"
      - "data/"
    status: pending

  - id: D1-T03
    day: 1
    milestone: M1
    title: "Create backend pyproject.toml and bootstrap virtualenv"
    type: setup
    estimated_minutes: 20
    description: |
      Backend dependencies: fastapi, uvicorn[standard], pydantic>=2.6, ollama,
      chromadb, httpx, python-multipart. Dev: pytest>=8, pytest-asyncio, ruff.
      Use Python 3.11 (chromadb has known issues on 3.13 as of plan date).
    artifacts:
      - "backend/pyproject.toml"
    acceptance_criteria:
      - "`backend/.venv` exists"
      - "`backend/.venv/bin/python -c 'import fastapi, pydantic, chromadb, ollama'` exits 0"
      - "`backend/.venv/bin/python -c 'import pytest'` exits 0"
    dependencies: ["D1-T02"]
    status: pending

  - id: D1-T04
    day: 1
    milestone: M1
    title: "Implement Pydantic schemas (schemas.py)"
    type: code
    estimated_minutes: 45
    description: |
      Define the typed input/output contract for the API.
      Inputs: PatientResponses with 10 fields covering episode_duration, trigger,
      hearing_status, migraine_history, nausea_vomiting, age_bracket, onset,
      gait, neuro_red_flags (bool), cv_risk. Use string Enums for categorical fields.
      Outputs: DiagnosisCandidate (diagnosis, confidence enum, supporting_criteria,
      missing_criteria, icvd_reference), StrokeAlert (triggered, reason, urgency
      literal, score_hints, score_standing), DiagnosticResult (differential list,
      stroke_alert, clinical_reasoning, next_steps, limitations, processing_time_ms).
    artifacts:
      - "backend/app/schemas.py"
    acceptance_criteria:
      - "`python -c 'from app.schemas import PatientResponses, DiagnosticResult, StrokeAlert; print(PatientResponses.model_fields.keys())'` lists all 10 fields"
      - "Confidence enum has exactly three values: alta, media, baja"
      - "StrokeAlert.urgency is constrained to literal('inmediata','alta','baja')"
    dependencies: ["D1-T03"]
    status: pending

  - id: D1-T05
    day: 1
    milestone: M1
    title: "Implement deterministic ICVD rule engine (rules.py)"
    type: code
    estimated_minutes: 90
    description: |
      Four evaluators returning DiagnosisCandidate each:
        evaluate_bppv_posterior, evaluate_vestibular_migraine,
        evaluate_meniere, evaluate_central_vertigo.
      Plus run_all_rules() returning the list sorted by confidence (alta > media > baja).
      Encode ICVD criteria A/B/C/D where applicable; track supporting and
      missing criteria per candidate. icvd_reference must cite the Bárány Society
      year (2015 for BPPV/EM, 2012 for VM).
      Central vertigo uses HINTS+Carmona&Kaski+GRACE-3 (no single ICVD code).
    artifacts:
      - "backend/app/rules.py"
    acceptance_criteria:
      - "All four evaluator functions return a valid DiagnosisCandidate for the canonical BPPV input (under_1min, position_change, none hearing, no red flags)"
      - "run_all_rules() returns a list of length 4"
      - "For the canonical BPPV input, run_all_rules()[0].diagnosis starts with 'BPPV'"
      - "For a stroke-pattern input (cant_sit + neuro_red_flags + 3_or_more cv_risk), run_all_rules()[0].diagnosis contains 'Central' and confidence is 'alta'"
    dependencies: ["D1-T04"]
    status: pending

  - id: D1-T06
    day: 1
    milestone: M1
    title: "Implement HINTS-adapted triage scoring (triage.py)"
    type: code
    estimated_minutes: 45
    description: |
      Function calculate_stroke_alert(PatientResponses) -> StrokeAlert.
      Weighted score:
        - gait=cant_sit: +100 (specificity 100% per Carmona&Kaski 2023)
        - neuro_red_flags=True: +80
        - onset=sudden: +30
        - cv_risk=3_or_more: +25; 1_to_2: +10
        - age_bracket=over_75: +15; 60_75: +8
      Thresholds: score>=100 -> triggered, urgency='inmediata';
                  score>=50  -> triggered, urgency='alta';
                  score>=25  -> not triggered, urgency='baja' (with low-risk reason);
                  else       -> not triggered, urgency='baja', reason='Sin signos de alarma central'.
      score_standing label: 'POSITIVO' if score>=50 else 'NEGATIVO'.
    artifacts:
      - "backend/app/triage.py"
    acceptance_criteria:
      - "calculate_stroke_alert() on cant_sit input returns triggered=True and urgency='inmediata'"
      - "calculate_stroke_alert() on all-normal input returns triggered=False and urgency='baja'"
      - "Returned object is a StrokeAlert instance"
    dependencies: ["D1-T04"]
    status: pending

  - id: D1-T07
    day: 1
    milestone: M1
    title: "Author initial ICVD RAG corpus (icvd_corpus.md)"
    type: content
    estimated_minutes: 60
    description: |
      Markdown file with H2-delimited sections, one per clinical topic:
        - BPPV del canal posterior
        - Enfermedad de Ménière
        - Migraña Vestibular
        - Algoritmo HINTS+
        - STANDING
        - Red Flags Críticas
        - TiTrATE Framework
      Each section cites the source (Bárány Society year, journal author).
      Spanish content. Plain markdown, no front-matter.
    artifacts:
      - "backend/app/data/icvd_corpus.md"
    acceptance_criteria:
      - "File has >= 7 H2 sections (lines matching '^## ')"
      - "File contains the substrings 'Bárány', 'HINTS', 'STANDING', 'TiTrATE'"
      - "File contains at least one numbered criterion line (e.g. 'A.', 'B.')"
    dependencies: ["D1-T02"]
    status: pending

  - id: D1-T08
    day: 1
    milestone: M1
    title: "Implement RAG layer with ChromaDB + nomic-embed-text (rag.py)"
    type: code
    estimated_minutes: 60
    description: |
      Class RAGStore with:
        - in-memory ChromaDB client, collection name 'vertigodx_icvd'
        - _chunk_markdown: split corpus by H2, return [(title, content), ...]
        - _embed(text): call ollama.embeddings(model='nomic-embed-text', prompt=text)
        - _ingest(): drop+recreate collection, add all chunks with their embeddings
        - retrieve(query: str, k: int = 3) -> list[{'title','content','distance'}]
      Module-level singleton get_store() for FastAPI lifecycle.
    artifacts:
      - "backend/app/rag.py"
    acceptance_criteria:
      - "`python -c 'from app.rag import get_store; s = get_store(); r = s.retrieve(\"BPPV criterios\", k=2); assert len(r) == 2 and \"BPPV\" in r[0][\"title\"]'` exits 0"
    dependencies: ["D1-T03", "D1-T07"]
    status: pending

  - id: D1-T09
    day: 1
    milestone: M1
    title: "Write versioned system prompt v1 (prompts.py)"
    type: code
    estimated_minutes: 30
    description: |
      SYSTEM_PROMPT_V1 string enforces:
        - Spanish clinical output only
        - never definitive diagnosis
        - always cite ICVD criteria
        - urgent referral if stroke flags trigger
        - JSON-only output with keys clinical_reasoning, next_steps, limitations
      build_user_prompt(responses_summary, rule_candidates, stroke_alert, rag_context) -> str
      concatenates the four sections with markdown headers.
    artifacts:
      - "backend/app/prompts.py"
    acceptance_criteria:
      - "`from app.prompts import SYSTEM_PROMPT_V1, build_user_prompt` imports cleanly"
      - "SYSTEM_PROMPT_V1 contains the substring 'español' and 'ICVD'"
      - "build_user_prompt('a','b','c','d') returns a string containing all four inputs"
    dependencies: ["D1-T03"]
    status: pending

  - id: D1-T10
    day: 1
    milestone: M1
    title: "Implement Gemma 4 client (llm.py)"
    type: code
    estimated_minutes: 60
    description: |
      reason_clinically(responses_summary, rule_candidates, stroke_alert,
        rag_context, model='gemma4:26b-a4b-it-q4_K_M', temperature=0.3) -> dict.
      Calls ollama.chat with format='json', temperature=0.3, top_p=0.95,
      top_k=64, num_ctx=8192. Parses JSON; on json.JSONDecodeError tries
      a `\\{.*\\}` regex fallback. On other exceptions, retries once with
      gemma4:e4b before raising.
    artifacts:
      - "backend/app/llm.py"
    acceptance_criteria:
      - "Calling reason_clinically with placeholder strings returns a dict containing the keys clinical_reasoning, next_steps, limitations"
      - "Output is in Spanish (clinical_reasoning contains a vowel-bearing accented char or common Spanish stopword: á|é|í|ó|ú|qué|del|para|con)"
    dependencies: ["D1-T01", "D1-T09"]
    status: pending

  - id: D1-T11
    day: 1
    milestone: M1
    title: "Wire FastAPI app with /healthcheck, /diagnose (main.py)"
    type: code
    estimated_minutes: 60
    description: |
      FastAPI app with CORS allowing http://localhost:3000.
      Endpoints:
        GET /healthcheck -> {"status":"ok","model":"gemma4:26b-a4b-it-q4_K_M","offline":true}
        POST /diagnose: PatientResponses -> DiagnosticResult.
      /diagnose pipeline:
        1. candidates = run_all_rules(responses)
        2. alert = calculate_stroke_alert(responses)
        3. rag_chunks = get_store().retrieve(f"{candidates[0].diagnosis} {candidates[1].diagnosis} criterios", k=3)
        4. llm_out = reason_clinically(..., rag_context=joined chunk contents)
        5. return DiagnosticResult(differential=candidates[:3], stroke_alert=alert,
             clinical_reasoning=llm_out['clinical_reasoning'],
             next_steps=llm_out['next_steps'],
             limitations=llm_out['limitations'],
             processing_time_ms=measured)
      Helper formatters _format_responses_for_llm, _format_candidates_for_llm,
      _format_stroke_alert produce the human-readable strings injected into the prompt.
    artifacts:
      - "backend/app/main.py"
    acceptance_criteria:
      - "`uvicorn app.main:app --port 8000` starts without error within 60s (including RAG ingest)"
      - "`curl http://localhost:8000/healthcheck` returns 200 with offline=true"
      - "POST /diagnose with the stroke payload (D1-T06 example) returns HTTP 200, stroke_alert.triggered=true, urgency='inmediata'"
    dependencies: ["D1-T05", "D1-T06", "D1-T08", "D1-T10"]
    status: pending

  - id: D1-T12
    day: 1
    milestone: M1
    title: "Write 5 demo cases as JSON ground truth"
    type: content
    estimated_minutes: 45
    description: |
      data/demo_cases.json — array of 5 objects, ids:
        case_01_bppv_clasico
        case_02_meniere
        case_03_migrana_vestibular
        case_04_stroke_cerebeloso
        case_05_caso_complejo_overlap
      Each object: id, label, narrative (Spanish, 1-2 sentences), responses (full
      10-field PatientResponses payload), expected_top (string) or expected_top_options
      (list), expected_stroke_alert (bool), optional expected_urgency.
    artifacts:
      - "data/demo_cases.json"
    acceptance_criteria:
      - "`jq 'length' data/demo_cases.json` returns 5"
      - "`jq '[.[] | .id]' data/demo_cases.json` contains all 5 expected ids"
      - "case_04_stroke_cerebeloso has expected_stroke_alert=true and expected_urgency='inmediata'"
      - "case_01_bppv_clasico has expected_stroke_alert=false"
    dependencies: ["D1-T04"]
    status: pending

  - id: D1-T13
    day: 1
    milestone: M1
    title: "Write rule and triage unit tests + demo case ground-truth tests"
    type: test
    estimated_minutes: 45
    description: |
      backend/tests/test_demo_cases.py covers:
        - test_all_cases_parseable: every case loads into PatientResponses
        - test_bppv_classic_detected: rule top-1 for case_01 == 'BPPV del canal posterior'
        - test_stroke_alert_triggers: alert for case_04 is triggered and urgency='inmediata'
        - test_meniere_high_confidence_with_fluctuating: case_02 Ménière confidence in {alta, media}
        - test_no_false_stroke_alarm_in_bppv: case_01 alert.triggered=false
      Run via `cd backend && pytest -v`.
    artifacts:
      - "backend/tests/test_demo_cases.py"
    acceptance_criteria:
      - "`cd backend && pytest -v` exits 0 with at least 5 passing tests"
    dependencies: ["D1-T05", "D1-T06", "D1-T12"]
    status: pending

  - id: D1-T14
    day: 1
    milestone: M1
    title: "Day 1 closing commit"
    type: chore
    estimated_minutes: 10
    description: |
      Stage backend/, data/demo_cases.json. Conventional commit on main.
      Do NOT stage docs/ or resources/ (gitignored).
    commands:
      - "git add backend data backlog.yaml"
      - "git commit -m 'feat(backend): day 1 — rule engine, triage, RAG, Gemma client, FastAPI baseline'"
      - "git push origin main"
    acceptance_criteria:
      - "`git log --oneline -1` shows the day-1 commit message"
      - "`git status` is clean for tracked files"
    dependencies: ["D1-T11", "D1-T13"]
    status: pending

  # =========================================================================
  # DAY 2 — Prompt refinement + frontend scaffold
  # =========================================================================

  - id: D2-T01
    day: 2
    milestone: M2
    title: "Morning checkpoint — verify Day 1 still green"
    type: chore
    estimated_minutes: 30
    description: |
      Sanity-check that Day 1 artifacts still pass after any environment
      changes overnight (Ollama restart, OS reboot, etc.).
    commands:
      - "ollama list | grep -q gemma4"
      - "cd backend && pytest -v"
      - "cd backend && uvicorn app.main:app --port 8000 &"
      - "sleep 2 && curl -fsS http://localhost:8000/healthcheck"
    acceptance_criteria:
      - "All Day 1 tests pass"
      - "/healthcheck returns 200 offline=true"
    dependencies: ["D1-T14"]
    status: pending

  - id: D2-T02
    day: 2
    milestone: M2
    title: "Build prompt-evaluation script (scripts/eval_prompts.py)"
    type: code
    estimated_minutes: 45
    description: |
      Runner that takes a prompt_version (v1, v2, v3, ...) as argv and
      executes the 5 demo cases through the full pipeline, printing
      expected_top vs actual_top, expected_stroke_alert vs actual,
      and the LLM reasoning, next_steps, limitations side-by-side.
      No assertions — this is for human review during prompt iteration.
    artifacts:
      - "backend/scripts/eval_prompts.py"
    acceptance_criteria:
      - "`cd backend && python scripts/eval_prompts.py v1` runs all 5 cases without exception and prints each case_id"
    dependencies: ["D2-T01"]
    status: pending

  - id: D2-T03
    day: 2
    milestone: M2
    title: "Iterate prompt to SYSTEM_PROMPT_V2 with strict Spanish + ICVD citation rules"
    type: code
    estimated_minutes: 90
    description: |
      Add SYSTEM_PROMPT_V2 to prompts.py. Stricter than V1:
        - explicit prohibition of English clinical loanwords ('stroke', 'follow-up', 'imaging')
        - mandatory ICVD criterion letter citation when applicable
        - first sentence MUST be the stroke recommendation when alert triggered
        - max 5 sentences in clinical_reasoning
      Swap llm.py to use V2 once it passes review on all 5 cases.
    artifacts:
      - "backend/app/prompts.py"
      - "backend/app/llm.py"
    acceptance_criteria:
      - "All 5 demo cases run via eval_prompts.py v2 with reasoning that does NOT contain 'stroke', 'follow-up', or 'imaging' (case-insensitive)"
      - "Case 04 reasoning's first 50 chars contain 'derivación' or 'urgente' or '⚠'"
    dependencies: ["D2-T02"]
    status: pending

  - id: D2-T04
    day: 2
    milestone: M2
    title: "(Optional) Add few-shot examples => SYSTEM_PROMPT_V3"
    type: code
    estimated_minutes: 60
    description: |
      Optional escalation if V2 still produces inconsistent reasoning across
      runs (temperature variance). Append 2 worked examples (BPPV classic +
      stroke cerebeloso) directly into the system prompt.
    artifacts:
      - "backend/app/prompts.py"
    acceptance_criteria:
      - "SYSTEM_PROMPT_V3 exists and is composed as SYSTEM_PROMPT_V2 + FEW_SHOT_EXAMPLES"
      - "eval_prompts.py v3 runs without exception"
    dependencies: ["D2-T03"]
    optional: true
    status: pending

  - id: D2-T05
    day: 2
    milestone: M2
    title: "Expand RAG corpus with maneuvers + differential table + red flags"
    type: content
    estimated_minutes: 60
    description: |
      Append to icvd_corpus.md:
        - Dix-Hallpike, Roll Test, Epley maneuver descriptions
        - differential table for acute sustained vertigo
        - empirical treatment summary
        - critical red flags consolidated list
      Re-ingestion happens automatically on FastAPI restart.
    artifacts:
      - "backend/app/data/icvd_corpus.md"
    acceptance_criteria:
      - "File line count grows by >= 50 lines vs Day 1 baseline"
      - "File contains the substrings 'Dix-Hallpike', 'Epley', 'AICA'"
    dependencies: ["D1-T07"]
    status: pending

  - id: D2-T06
    day: 2
    milestone: M2
    title: "Add /diagnose/stream and /demo-cases endpoints + warmup"
    type: code
    estimated_minutes: 60
    description: |
      In backend/app/main.py:
        - GET /demo-cases: returns the parsed contents of data/demo_cases.json
        - POST /diagnose/stream: Server-Sent Events stream that emits
          {stage:'rules'|'triage'|'rag'|'reasoning'|'complete', payload:...}
          so the UI can show progressive feedback during the 3-5s Gemma call.
        - @app.on_event('startup') warmup: do a 5-token ollama.chat to load 26B into RAM.
    artifacts:
      - "backend/app/main.py"
    acceptance_criteria:
      - "`curl http://localhost:8000/demo-cases | jq 'length'` returns 5"
      - "After server startup, the first `curl POST /diagnose` returns within 8 seconds (warmup happened)"
    dependencies: ["D2-T03"]
    status: pending

  - id: D2-T07
    day: 2
    milestone: M2
    title: "End-to-end tests against the running API (test_e2e.py)"
    type: test
    estimated_minutes: 60
    description: |
      backend/tests/test_e2e.py uses httpx to hit localhost:8000.
      pytest-parametrize over the 5 case_ids:
        - status 200
        - response has differential, stroke_alert, clinical_reasoning, next_steps
        - clinical_reasoning length > 20
        - clinical_reasoning does NOT contain English clinical terms
        - expected_stroke_alert matches actual
        - expected_top is a substring of differential[0].diagnosis when defined
      Fixture skips the module if API is not running on 8000.
    artifacts:
      - "backend/tests/test_e2e.py"
    acceptance_criteria:
      - "With uvicorn running, `pytest backend/tests/test_e2e.py -v` passes all 5 parametrized cases"
    dependencies: ["D2-T06"]
    status: pending

  - id: D2-T08
    day: 2
    milestone: M2
    title: "Bootstrap Next.js 14 frontend with shadcn/ui"
    type: scaffold
    estimated_minutes: 45
    description: |
      Use create-next-app with: typescript, tailwind, app router, no src dir,
      import alias @/*. Then initialize shadcn/ui with Default style + Slate
