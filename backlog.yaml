buffer_day:
  day: 5
  rules:
    - "Only allowed actions: fix critical bugs blocking submission, re-record video, edit writeup."
    - "Do NOT build new features."
    - "If everything is green by 12:00 local, rest."

# =============================================================================
# RISK REGISTER
# =============================================================================
risks:
  - id: R1
    risk: "26B model too slow on local hardware"
    likelihood: medium
    mitigation: "Fall back to gemma4:e4b in llm.py. Detection: Day 1 smoke test latency > 15s."
  - id: R2
    risk: "Gemma outputs English clinical terms"
    likelihood: high
    mitigation: "SYSTEM_PROMPT_V2 prohibitions + e2e test that fails on English terms."
  - id: R3
    risk: "Deploy fails on Day 3"
    likelihood: medium
    mitigation: "Fallback to localhost-only demo via screen recording. README notes the live-demo URL is replaced by the recorded YouTube video."
  - id: R4
    risk: "Video duration > 3:00"
    likelihood: medium
    mitigation: "Cut B-roll, trim intro. Hard rule: never submit a >3:00 video — disqualification risk."
  - id: R5
    risk: "Submission technical failure on Kaggle"
    likelihood: low
    mitigation: "Submit by D4-T10 target (May 17 EOD), 24h before deadline."
